
name: Wazuh DR Backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wazuh-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.WAZUH_SSH_PRIVATE_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/wazuh_dr_key
          chmod 600 ~/.ssh/wazuh_dr_key

      - name: Run Wazuh health check and backup
        env:
          WAZUH_HOST: ${{ secrets.WAZUH_HOST }}
          WAZUH_USER: ${{ secrets.WAZUH_USER }}
        run: |
          set -eu

          ssh-keyscan -H "$WAZUH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/wazuh_dr_key \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            "$WAZUH_USER@$WAZUH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== Wazuh health check ==="
          bash /usr/local/bin/wazuh-dr-health.sh

          echo "=== Run encrypted backup ==="
          bash /usr/local/bin/wazuh-dr-backup.sh

          echo "=== Verify latest backup ==="
          cd /var/backups/wazuh-dr

          latest=$(
            find . -maxdepth 1 -type f \
              -name 'wazuh-config-*.tar.gz.gpg' \
              -printf '%T@ %f\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-
          )

          test -n "$latest" || {
            echo "ERROR: No backup archive found"
            exit 1
          }

          checksum="${latest%.tar.gz.gpg}.sha256"
          test -f "$checksum" || {
            echo "ERROR: Checksum file missing: $checksum"
            exit 1
          }

          sha256sum -c "$checksum"

          echo "=== Latest backup ==="
          ls -lh -- "$latest" "$checksum"
          echo "Wazuh backup workflow completed."
          REMOTE

      - name: Remove private key
        if: always()
        run: rm -f ~/.ssh/wazuh_dr_key
